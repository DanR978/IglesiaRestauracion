<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fish schools – L→R seamless loop</title>
<style>
  :root{
    /* tune these if you like */
    --tile-w: 1600;      /* width of one school tile (SVG units) */
    --lane-h: 120;       /* lane height (px) */
    --up-speed: 22s;     /* how long a full pass takes */
    --down-speed: 28s;
    --fish-scale: 1;     /* 1 = fish around 100×60 px each */
    --bg: #2087ad;
  }

  html,body{height:100%;margin:0}
  body{background:var(--bg);overflow:hidden;font-family:system-ui, sans-serif}

  /* full-bleed stage */
  .stage{
    position:relative;
    width:100vw;height:100vh;
  }

  /* a horizontal conveyor (clip the children) */
  .lane{
    position:absolute; left:0; right:0;
    height:var(--lane-h); overflow:hidden;
    transform: translateZ(0); /* keep it buttery */
  }

  /* two-tile strip that scrolls across */
  .strip{
    position:absolute; top:50%; transform:translateY(-50%);
    width:calc(var(--tile-w) * 2px);  /* two tiles side-by-side */
    height:100%;
    display:flex;
    animation: swim-right var(--up-speed) linear infinite;
    will-change: transform;
  }

  /* clone with different speed for the other lane */
  .strip--down{ animation-duration: var(--down-speed); }

  /* each SVG tile */
  .tile{
    width:calc(var(--tile-w) * 1px); height:100%;
  }

  /* tiny per-fish wiggle (subtle) */
  .wiggle > g{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: wiggle 1.6s ease-in-out infinite alternate;
  }
  @keyframes wiggle{
    0%{ transform: rotate(-3deg) translateX(-1px); }
    100%{ transform: rotate(3deg) translateX(1px); }
  }

  /* conveyor motion: start off-screen left and slide to zero */
  @keyframes swim-right{
    0%   { transform: translate(-100%, -50%); }
    100% { transform: translate( 0%,   -50%); }
  }
</style>
</head>
<body>
  <div class="stage">
    <!-- Upstream lane -->
    <div class="lane" style="top:20%;">
      <div class="strip">
        <svg class="tile" viewBox="0 0 1600 120" xmlns="http://www.w3.org/2000/svg">
          <!-- one school (tile) -->
          <g class="wiggle" transform="scale(var(--fish-scale))">
            <!-- fish are ~100×60 each; duplicate/offset as you like -->
            <g transform="translate(  0,60)"><use href="#fish-up"/></g>
            <g transform="translate(180,40)"><use href="#fish-up"/></g>
            <g transform="translate(360,75)"><use href="#fish-up"/></g>
            <g transform="translate(540,50)"><use href="#fish-up"/></g>
            <g transform="translate(720,65)"><use href="#fish-up"/></g>
            <g transform="translate(900,45)"><use href="#fish-up"/></g>
            <g transform="translate(1080,70)"><use href="#fish-up"/></g>
            <g transform="translate(1260,55)"><use href="#fish-up"/></g>
            <g transform="translate(1440,80)"><use href="#fish-up"/></g>
          </g>
        </svg>
        <!-- second tile creates the seamless wrap -->
        <svg class="tile" viewBox="0 0 1600 120" xmlns="http://www.w3.org/2000/svg">
          <g class="wiggle" transform="scale(var(--fish-scale))">
            <g transform="translate(  0,60)"><use href="#fish-up"/></g>
            <g transform="translate(180,40)"><use href="#fish-up"/></g>
            <g transform="translate(360,75)"><use href="#fish-up"/></g>
            <g transform="translate(540,50)"><use href="#fish-up"/></g>
            <g transform="translate(720,65)"><use href="#fish-up"/></g>
            <g transform="translate(900,45)"><use href="#fish-up"/></g>
            <g transform="translate(1080,70)"><use href="#fish-up"/></g>
            <g transform="translate(1260,55)"><use href="#fish-up"/></g>
            <g transform="translate(1440,80)"><use href="#fish-up"/></g>
          </g>
        </svg>
      </div>
    </div>

    <!-- Downstream lane -->
    <div class="lane" style="bottom:20%;">
      <div class="strip strip--down">
        <svg class="tile" viewBox="0 0 1600 120" xmlns="http://www.w3.org/2000/svg">
          <g class="wiggle" transform="scale(var(--fish-scale))">
            <g transform="translate(  0,60)"><use href="#fish-down"/></g>
            <g transform="translate(160,40)"><use href="#fish-down"/></g>
            <g transform="translate(340,75)"><use href="#fish-down"/></g>
            <g transform="translate(520,50)"><use href="#fish-down"/></g>
            <g transform="translate(700,65)"><use href="#fish-down"/></g>
            <g transform="translate(880,45)"><use href="#fish-down"/></g>
            <g transform="translate(1060,70)"><use href="#fish-down"/></g>
            <g transform="translate(1240,55)"><use href="#fish-down"/></g>
            <g transform="translate(1420,80)"><use href="#fish-down"/></g>
          </g>
        </svg>
        <svg class="tile" viewBox="0 0 1600 120" xmlns="http://www.w3.org/2000/svg">
          <g class="wiggle" transform="scale(var(--fish-scale))">
            <g transform="translate(  0,60)"><use href="#fish-down"/></g>
            <g transform="translate(160,40)"><use href="#fish-down"/></g>
            <g transform="translate(340,75)"><use href="#fish-down"/></g>
            <g transform="translate(520,50)"><use href="#fish-down"/></g>
            <g transform="translate(700,65)"><use href="#fish-down"/></g>
            <g transform="translate(880,45)"><use href="#fish-down"/></g>
            <g transform="translate(1060,70)"><use href="#fish-down"/></g>
            <g transform="translate(1240,55)"><use href="#fish-down"/></g>
            <g transform="translate(1420,80)"><use href="#fish-down"/></g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- defs: two fish symbols (~100×60 each). Swap these shapes with your real paths. -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Upstream fish (teal) -->
      <symbol id="fish-up" viewBox="0 0 100 60">
        <g>
          <ellipse cx="40" cy="30" rx="35" ry="18" fill="#30505a" stroke="#231f20" stroke-width="2"/>
          <polygon points="75,30 98,18 98,42" fill="#30505a" stroke="#231f20" stroke-width="2"/>
          <circle cx="30" cy="27" r="2.2" fill="#fff"/>
        </g>
      </symbol>

      <!-- Downstream fish (outline) -->
      <symbol id="fish-down" viewBox="0 0 100 60">
        <g fill="none" stroke="#2f2b2c" stroke-opacity=".55" stroke-width="2">
          <ellipse cx="40" cy="30" rx="35" ry="18"/>
          <polygon points="75,30 98,18 98,42"/>
        </g>
      </symbol>
    </defs>
  </svg>
</body>
</html>
