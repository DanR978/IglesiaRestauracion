<!-- Events (Upcoming-only) -->
<section class="events l-container" aria-labelledby="events-title-home" data-events data-limit="4">
  <div class="event__header">
    <h2 id="events-title-home" class="animate-fade-in" data-threshold="1">Proximos Eventos</h2>
    <div class="event__header__actions animate-fade-in" data-threshold="1">
      <a class="ird-btn ird-btn--teal" href="eventos">Más eventos</a>
      <a class="ird-btn ird-btn--teal" href="/calendario">Ver Calendario</a>
    </div>
  </div>

  <div class="events__grid" id="events-grid" role="list"></div>

  <div class="events__empty" hidden>
    <p class="animate-fade-in" data-threshold="1">No hay eventos próximos por ahora. ¡Vuelve pronto!</p>
  </div>
</section>
