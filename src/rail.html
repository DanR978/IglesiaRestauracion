<!-- /src/rail.html -->
<section class="l-container" aria-labelledby="events-title">
  <div class="c-rail__header">
    <h2 id="events-title " class="c-rail__title animate-fade-in" data-threshold="1">Eventos</h2>

    <nav class="c-rail__tabs" aria-label="Ver eventos">
      <button class="c-rail__tab is-active js-rail-tab animate-fade-in" data-threshold="1" type="button"
        data-target="#rail-upcoming">Próximos</button>
      <button class="c-rail__tab js-rail-tab animate-fade-in" data-threshold="1" type="button"
        data-target="#rail-past">Pasados</button>
    </nav>
  </div>

  <!-- Próximos -->
  <div id="rail-upcoming" class="c-rail is-active animate-fade-in" data-threshold="1" data-rail="events"
    data-filter="upcoming" aria-label="Próximos eventos">
    <div class="c-rail__controls">
      <button class="c-rail__btn js-rail-prev" type="button"
        aria-label="Anterior">‹</button>
      <button class="c-rail__btn js-rail-next" type="button"
        aria-label="Siguiente">›</button>
    </div>
    <div class="c-rail__track js-rail-track" tabindex="0" role="list"></div>
  </div>

  <!-- Pasados -->
  <div id="rail-past" class="c-rail animate-fade-in" data-threshold="1" data-rail="events" data-filter="past"
    aria-label="Eventos pasados">
    <div class="c-rail__controls">
      <button class="c-rail__btn js-rail-prev" type="button"
        aria-label="Anterior">‹</button>
      <button class="c-rail__btn js-rail-next" type="button"
        aria-label="Siguiente">›</button>
    </div>
    <div class="c-rail__track js-rail-track animate-fade-in" data-threshold="1" tabindex="0" role="list"></div>
  </div>
