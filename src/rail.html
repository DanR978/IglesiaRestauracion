<section class="l-container" aria-labelledby="events-title">
  <div class="c-rail__header">
    <h2 id="events-title" class="c-rail__title">Eventos</h2>

    <nav class="c-rail__tabs" aria-label="Ver eventos">
      <button class="c-rail__tab is-active js-rail-tab" type="button"
        data-target="#rail-upcoming">Próximos</button>
      <button class="c-rail__tab js-rail-tab" type="button"
        data-target="#rail-past">Pasados</button>
    </nav>
  </div>

  <!-- Próximos -->
  <div id="rail-upcoming" class="c-rail is-active" data-rail="events"
    data-filter="upcoming" aria-label="Próximos eventos">
    <div class="c-rail__controls">
      <button class="c-rail__btn js-rail-prev" type="button"
        aria-label="Anterior">‹</button>
      <button class="c-rail__btn js-rail-next" type="button"
        aria-label="Siguiente">›</button>
    </div>
    <div class="c-rail__track js-rail-track" tabindex="0" role="list"></div>
  </div>

  <!-- Pasados -->
  <div id="rail-past" class="c-rail" data-rail="events" data-filter="past"
    aria-label="Eventos pasados">
    <div class="c-rail__controls">
      <button class="c-rail__btn js-rail-prev" type="button"
        aria-label="Anterior">‹</button>
      <button class="c-rail__btn js-rail-next" type="button"
        aria-label="Siguiente">›</button>
    </div>
    <div class="c-rail__track js-rail-track" tabindex="0" role="list"></div>
  </div>
