<div id="loginModal" class="login-modal" aria-hidden="true" data-backdrop>
  <div class="login-dialog" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <button type="button" class="login-close" aria-label="Cerrar" data-close>×</button>

    <div class="login-container" id="loginContainer">
      <!-- SIGN IN -->
      <div class="login-pane login-pane--sign-in">
        <form class="login-form" id="loginForm" action="#" autocomplete="on" novalidate>
          <h1 id="loginTitle" class="login-title">Iniciar sesión</h1>
          <p class="login-muted">Usa tu cuenta para continuar</p>

          <input id="loginEmail" class="login-input" name="email" type="email"
                 placeholder="E-mail" autocomplete="email" required>
          <input id="loginPassword" class="login-input" name="password" type="password"
                 placeholder="Contraseña" autocomplete="current-password" required>

          <a href="#" class="login-link" aria-disabled="true">¿Olvidaste tu contraseña?</a>

          <div class="login-actions">
            <button class="ird-btn ird-btn--donate" id="loginSubmit" type="submit">Entrar</button>
          </div>

          <div class="login-msg" id="loginMsg" role="status" aria-live="polite"></div>
        </form>
      </div>
