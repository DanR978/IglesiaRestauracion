<section>
    <div class="contact-wrapper">
        <div class="contact-info">
        <h2 class="contact-info__title">Contáctanos</h2>
        <p class="contact-info__subtitle">Nos encantaría saber de ti</p>

        <form action="https://formsubmit.co/c0f27151522f7328138e75e6ade0c197" method="POST">
            <div class="form-grid">
            <div class="form-group">
                <label for="first-name">* Nombre</label>
                <input type="text" id="first-name" name="first-name" placeholder="Ex: Javier" required />
            </div>

            <div class="form-group">
                <label for="last-name">* Apellido</label>
                <input type="text" id="last-name" name="last-name" placeholder="Ex: Garcia" required />
            </div>

            <div class="form-group full-width">
                <label for="phone">* Número de Teléfono</label>
                <input type="tel" id="phone" name="phone" placeholder="Ex: 857-111-222" required />
            </div>

            <div class="form-group full-width">
                <label for="email">* Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="Ex: serve@irdlex.org" required />
            </div>

            <div class="form-group full-width">
                <label for="subject">* Asunto</label>
                <input type="text" id="subject" name="subject" placeholder="Ex: Quiero Conocer a Cristo" required />
            </div>

            <div class="form-group full-width">
                <label for="message" class="form-entry-header">* Mensaje</label>
                <textarea id="message" name="message" rows="7" placeholder="Ex: Me gustaria ir a su Iglesia" required></textarea>
            </div>
            <div class="disclaimer">
                <p>Al enviar este formulario, aceptas que tus datos sean almacenados y procesados para responder a tu consulta.<br><a href="https://www.irdlex.org/privacy-policy" target="_blank">Leer más</a></p>
            </div>
            <!-- Hidden fields -->
            <input type="hidden" name="_captcha" value="true">
            <input type="text" name="_honey" style="display:none">
            <input type="hidden" name="_next" value="https://www.irdlex.org/visit/">
            </div>

            <button type="submit" class="ird-btn ird-btn--teal">Enviar Mensaje</button>
        </form>
        </div>
    </div>
</section>
