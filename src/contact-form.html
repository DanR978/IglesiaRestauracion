<div class="contact-wrapper">
    <div class="contact-info">
        <h2 class="contact-info__title">Contáctanos</h2>
        <p class="contact-info__subtitle">Nos encantaría saber de ti</p>

        <form class="contact-form" action="https://formsubmit.co/c0f27151522f7328138e75e6ade0c197" method="POST"
            novalidate>
            <div class="form-grid">
                <div class="form-group u-float-group animate-fade-in" data-threshold="1">
                    <input type="text" id="first-name" name="first-name" placeholder=" " autocomplete="given-name" />
                    <label class="u-float-label" for="first-name">Nombre</label>
                </div>

                <div class="form-group full-width u-float-group animate-fade-in" data-threshold="1">
                    <input type="tel" id="phone" name="phone" placeholder=" " autocomplete="tel" inputmode="numeric" pattern="[0-9]*" />
                    <label class="u-float-label" for="phone">Teléfono</label>
                </div>

                <div class="form-group full-width u-float-group animate-fade-in" data-threshold="1">
                    <input type="email" id="email" name="email" placeholder=" " autocomplete="email" />
                    <label class="u-float-label" for="email">E-mail</label>
                </div>

                <div class="form-group full-width u-float-group animate-fade-in" data-threshold="1">
                    <textarea id="message" name="message" rows="4" maxlength="300" placeholder=" "></textarea>
                    <label class="u-float-label" for="message">Mensaje</label>
                </div>

                <input type="hidden" name="_captcha" value="false" />
                <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />
            </div>
            <div class="form-submit">
                <button type="submit" class="ird-btn ird-btn--teal animate-fade-in" data-threshold="1">
                    Enviar Mensaje
                </button>
            </div>

            <noscript>
                <p style="margin-top:.75rem;color:#b91c1c;">
                    Para enviar el formulario, habilita JavaScript en tu navegador.
                </p>
            </noscript>
        </form>
    </div>
    <div class="contact-svg animate-fade-in" data-threshold="1">
        <svg height="250px"><use href="#floating-envelope"/></svg>
    </div>
</div>
