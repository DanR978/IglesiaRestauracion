<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <title>Página no encontrada · Iglesia Restauración Divina</title>
  <meta name="description" content="No encontramos esta página. Te ayudamos a volver al inicio de Iglesia Restauración Divina.">

  <link rel="icon" href="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/light-church-logo.ico">
  <base href="/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carattere&family=Geist:wght@100..900&family=Signika:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    /* Self-contained so the 404 always renders, even if a deeper asset 404s. */
    .nf {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.25rem;
      padding: 2rem 1.25rem;
      background: var(--color-bg-light, #fff);
      color: var(--color-text, #394548);
    }
    .nf__logo { width: 64px; height: auto; margin-bottom: .5rem; opacity: .9; }
    .nf__code {
      font-family: var(--font-Signika, sans-serif);
      font-weight: 700;
      letter-spacing: .04em;
      font-size: clamp(3rem, 12vw, 5.5rem);
      line-height: 1;
      color: var(--color-secondary, #9a6a2c);
      margin: 0;
    }
    .nf__title {
      font-family: var(--font-Signika, sans-serif);
      font-weight: 700;
      font-size: clamp(1.4rem, 4vw, 2rem);
      margin: 0;
    }
    .nf__text { max-width: 46ch; margin: 0; line-height: 1.6; opacity: .85; }
    .nf__actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      justify-content: center;
      margin-top: .5rem;
    }
  </style>
</head>

<body>
  <main class="nf">
    <img class="nf__logo"
         src="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/light-church-logo.ico"
         alt="Iglesia Restauración Divina">
    <p class="nf__code">404</p>
    <h1 class="nf__title">No encontramos esta página</h1>
    <p class="nf__text">
      Puede que el enlace haya cambiado o que la página ya no exista.
      Te llevamos de vuelta a casa.
    </p>
    <div class="nf__actions">
      <a href="/" class="ird-btn ird-btn--teal">Volver al inicio</a>
      <a href="/visitanos" class="ird-btn ird-btn--outline ird-btn--teal">Planea tu visita</a>
      <a href="/contacto/" class="ird-btn ird-btn--outline ird-btn--teal">Contáctanos</a>
    </div>
  </main>
</body>

</html>
