    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Iniciar Sesión",
        "url": "https://www.irdlex.org/login/"
    }
    </script>
    </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <h1 class="login-title">Iniciar Sesión</h1>

        <label class="login-label" for="email">Correo</label>
        <input class="login-input" id="email" type="email" autocomplete="email">

        <label class="login-label" for="password">Contraseña</label>
        <input class="login-input" id="password" type="password" autocomplete="current-password">

        <button class="login-btn" id="login">Entrar</button>

        <div class="login-msg" id="msg" role="status" aria-live="polite"></div>
        <p class="login-footnote">
          <a class="login-link" href="#" id="reset">¿Olvidaste tu contraseña?</a>
        </p>
      </div>
    </div>

    <script type="module">
      import { login, resetPw, watchAuth, isAdmin } from "/js/firebase.js";
      const $ = s => document.querySelector(s);

      const emailEl = $('#email');
      const passEl  = $('#password');
      const btn     = $('#login');
      const msg     = $('#msg');
      const reset   = $('#reset');

      btn?.addEventListener('click', async ()=>{
        msg.textContent = "";
        try { await login(emailEl.value.trim(), passEl.value); }
        catch(e){ msg.textContent = e.message || "Error al iniciar sesión"; }
      });

      reset?.addEventListener('click', async (e)=>{
        e.preventDefault();
        const email = emailEl.value.trim();
        if (!email) return msg.textContent = "Escribe tu correo primero.";
        await resetPw(email);
        msg.textContent = "Te enviamos un correo de restablecimiento.";
      });

      watchAuth(async (user)=>{
        if (user && await isAdmin(user.uid)) {
          location.href = "/manage/index.html";
        }
      });
    </script>
  </body>
</html>
