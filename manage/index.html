<!doctype html>
<html lang="es">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Manage</title>
<style>
body{font-family:system-ui,Segoe UI,Inter,Roboto;margin:0;background:#f6f8f9}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #eaeef1}
.nav{display:flex;gap:10px}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;background:#eef2f7;color:#111}
.nav a.active{background:#345a65;color:#fff}
.container{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #eaeef1;border-radius:16px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}
input,button{font:inherit}
input{width:100%;padding:.7rem;border:1px solid #e5e8eb;border-radius:10px}
button{padding:.7rem 1rem;border:0;border-radius:10px;background:#345a65;color:#fff;font-weight:700;cursor:pointer}
.btn.danger{background:#c0392b}
.small{font-size:.9rem;color:#475569}
.list{display:grid;gap:10px;max-height:60vh;overflow:auto}
.item{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center;border:1px solid #eef2f4;border-radius:12px;padding:10px;background:#fff}
.item img{width:80px;height:60px;object-fit:cover;border-radius:8px;background:#eef2f4}
.hidden{display:none!important}
</style></head>
<body>
  <div class="top">
    <div class="nav">
      <a href="#overview" class="active">Overview</a>
      <a href="#analytics">Analytics</a>
      <a href="#events">Manage Events</a>
    </div>
    <button id="logout">Salir</button>
  </div>

  <div class="container">
    <section id="v-overview" class="card"><h2>Overview</h2><p class="small">KPIs aquí más tarde.</p></section>
    <section id="v-analytics" class="card hidden"><h2>Analytics</h2><p class="small">Integraremos GA4 luego.</p></section>
    <section id="v-events" class="card hidden">
      <h2>Manage Events</h2>
      <div class="grid c2">
        <form id="form">
          <label>Título</label><input name="title" required>
          <label>Etiqueta</label><input name="tag">
          <div class="grid c3">
            <div><label>Fecha</label><input name="date" type="date" required></div>
            <div><label>Hora</label><input name="time"></div>
            <div><label>Ubicación</label><input name="location"></div>
          </div>
          <label>CTA Texto</label><input name="cta_label">
          <label>CTA URL</label><input name="cta_url" placeholder="/eventos/...">
          <label>Imagen</label><input name="image" type="file" accept="image/*">
          <div class="small" id="status"></div>
          <button type="submit">Guardar</button>
        </form>

        <div>
          <div class="small" id="counts">Cargando…</div>
          <div class="list" id="list"></div>
        </div>
      </div>
    </section>
  </div>

<script type="module">
  import { watchAuth, isAdmin, logout, EventsAPI } from "/js/firebase.js";
  const $=s=>document.querySelector(s);

  // Protect page
  watchAuth(async (user)=>{
    if(!user) return location.href="/login/index.html";
    if(!(await isAdmin(user.uid))) return location.href="/login/index.html";
  });

  // Tabs
  const views={overview:"#v-overview",analytics:"#v-analytics",events:"#v-events"};
  const show=h=>{
    document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===h));
    Object.values(views).forEach(sel=>document.querySelector(sel).classList.add('hidden'));
    document.querySelector(views[h.slice(1)]||views.overview).classList.remove('hidden');
  };
  addEventListener('hashchange',()=>show(location.hash||'#overview')); show(location.hash||'#overview');
  $("#logout").onclick=logout;

  // Events live list
  const list=$("#list"), counts=$("#counts"), status=$("#status"), form=$("#form");
  EventsAPI.liveQuery((snap)=>{
    const today=new Date(new Date().toDateString());
    let upcoming=0,past=0; const nodes=[];
    snap.forEach(d=>{
      const e=d.data(); const isPast=new Date((e.date||"")+"T00:00:00")<today; isPast?past++:upcoming++;
      const div=document.createElement('div'); div.className='item';
      div.innerHTML=`<img src="${e.image||''}"><div>
        <strong>${e.title||'(sin título)'}</strong>
        <div class="small">${e.date||''} ${e.time? '• '+e.time:''} ${e.location? '• '+e.location:''}</div>
        <div class="small">${e.tag? 'Etiqueta: '+e.tag+' • ':''}${e.cta_label||''} ${e.cta_url? '('+e.cta_url+')':''}</div></div>
        <button class="btn danger" data-id="${d.id}">Eliminar</button>`;
      nodes.push(div);
    });
    list.replaceChildren(...nodes);
    counts.textContent=`Próximos: ${upcoming} • Pasados: ${past} • Total: ${snap.size}`;
    list.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{
      if(!confirm('¿Eliminar este evento?')) return;
      try{ await EventsAPI.storage.removeFolder(b.dataset.id);}catch{}
      await EventsAPI.remove(b.dataset.id);
    });
  });

  // Create + optional image upload
  form.onsubmit=async(e)=>{
    e.preventDefault();
    const fd=new FormData(form);
    const data={
      title: fd.get('title')?.toString().trim(),
      date:  fd.get('date')?.toString().trim(),
      time:  fd.get('time')?.toString().trim(),
      location: fd.get('location')?.toString().trim(),
      tag:   fd.get('tag')?.toString().trim(),
      cta_label: fd.get('cta_label')?.toString().trim(),
      cta_url:   fd.get('cta_url')?.toString().trim()
    };
    if(!data.title||!data.date){ status.textContent='Título y fecha requeridos.'; return; }
    const docRef = await EventsAPI.create(data);
    const file = fd.get('image');
    if(file && file.size){
      const { task, ref } = EventsAPI.storage.uploadFor(docRef.id, file);
      task.on('state_changed', s=> status.textContent=`Subiendo imagen… ${Math.round(100*s.bytesTransferred/s.totalBytes)}%`);
      await task; const url = await EventsAPI.storage.getURL(ref);
      await EventsAPI.update(docRef.id,{ image:url });
    }
    status.textContent='¡Guardado!'; form.reset(); setTimeout(()=>status.textContent='',1000);
  };
</script>
</body></html>
