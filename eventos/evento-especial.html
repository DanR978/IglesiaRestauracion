<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="index, follow">

    <title>Evento especial · Iglesia Restauración Divina</title>
    <meta name="description"
      content="Inscríbete en este evento especial de la Iglesia Restauración Divina en Lexington, KY." />

    <link
      href="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/light-church-logo.ico"
      rel="icon">
    <link
      href="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/light-church-logo.ico"
      rel="icon" media="(prefers-color-scheme: light)">
    <link
      href="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/dark-church-logo.ico"
      rel="icon" media="(prefers-color-scheme: dark)">

    <link rel="canonical" href="https://www.irdlex.org/eventos/evento-especial" />

    <base href="/">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="format-detection" content="telephone=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet">

    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>

  <body class="page-event-detail">

    <header class="ev2-topbar">
      <a href="/" class="ev2-topbar__brand">Iglesia Restauración Divina</a>
    </header>

    <main class="ev2">

      <div id="event-loading" class="ev2__status">
        <p>Cargando detalles del evento...</p>
      </div>

      <div id="event-error" class="ev2__status" style="display: none;">
        <h2>Evento no encontrado</h2>
        <p>Este evento no existe o ya no está disponible.</p>
        <a href="/eventos" class="ird-btn ird-btn--teal">Ver todos los eventos</a>
      </div>

      <article id="event-content" class="ev2__wrap" style="display: none;">

        <nav class="ev2__crumbs" aria-label="Migas de pan">
          <a href="/eventos">Eventos</a>
          <span aria-hidden="true">›</span>
          <span id="event-crumb">Evento</span>
        </nav>

        <div class="ev2__grid">

          <!-- Main column -->
          <div class="ev2__main">
            <h1 class="ev2__title" id="event-title">Evento</h1>
            <p class="ev2__when" id="event-when"></p>

            <section id="event-description-section" class="ev2__section" style="display:none">
              <h2 class="ev2__h">Detalles</h2>
              <div id="event-description" class="ev2__body rich-content"></div>
            </section>

            <section id="event-information-section" class="ev2__section" style="display:none">
              <h2 class="ev2__h">Información</h2>
              <div id="event-information" class="ev2__body rich-content"></div>
            </section>
          </div>

          <!-- Sidebar -->
          <aside class="ev2__side">
            <div class="ev2__media" id="event-media" style="display:none">
              <img id="ed-hero-img" src="" alt="" loading="eager">
            </div>

            <div class="ev2__panel">
              <div class="ev2__field" id="event-date-block" style="display:none">
                <div class="ev2__field-label">Fecha</div>
                <div class="ev2__field-value">
                  <span id="event-date"></span>
                  <span id="event-time" class="ev2__time"></span>
                </div>
              </div>

              <div class="ev2__field" id="event-location-row" style="display:none">
                <div class="ev2__field-label">Ubicación</div>
                <div class="ev2__field-value" id="event-location"></div>
                <a id="event-directions" class="ev2__pill" target="_blank" rel="noopener">
                  <i class="fas fa-diamond-turn-right" aria-hidden="true"></i> Cómo llegar
                </a>
              </div>

              <a id="event-register-btn" href="#" class="ird-btn ird-btn--teal ev2__register">
                Registrarse
              </a>
              <p id="event-register-closed" class="ev2__closed" style="display:none">
                <i class="fas fa-lock" aria-hidden="true"></i> Inscripciones cerradas
              </p>
            </div>
          </aside>

        </div>
      </article>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/pages/eventos/special-event.js"></script>
    <script type="module" src="/js/utils/load-icons.js"></script>
    <script type="module" src="/js/include.js"></script>
    <script type="module" src="/js/components/page-transition.js"></script>
  </body>
</html>
