<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">

    <title>Inscripción · Iglesia Restauración Divina</title>
    <meta name="description"
      content="Formulario de inscripción para eventos especiales de la Iglesia Restauración Divina." />

    <link
      href="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/light-church-logo.ico"
      rel="icon">
    <link
      href="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/light-church-logo.ico"
      rel="icon" media="(prefers-color-scheme: light)">
    <link
      href="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/dark-church-logo.ico"
      rel="icon" media="(prefers-color-scheme: dark)">

    <base href="/">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="format-detection" content="telephone=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet">

    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>

  <body class="page-event-detail">

    <header id="header"></header>

    <main class="ee-reg">

      <div id="reg-loading" class="ed-status">
        <p>Cargando inscripción...</p>
      </div>

      <div id="reg-error" class="ed-status" style="display: none;">
        <h2>Inscripción no disponible</h2>
        <p id="reg-error-msg">Este evento no existe o las inscripciones están cerradas.</p>
        <a href="/eventos" class="ird-btn ird-btn--teal">Ver todos los eventos</a>
      </div>

      <article id="reg-content" class="ee-reg-card" style="display: none;">
        <span class="ed-tag">Inscripción</span>
        <h1 class="ed-title" id="reg-event-title">Evento</h1>
        <p class="ee-reg-card__sub">Completa los pasos para inscribirte. Solo toma un minuto.</p>
        <button type="button" class="ird-btn ird-btn--orange" id="reg-open-btn">Comenzar inscripción</button>
      </article>

    </main>

    <footer id="footer"></footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/pages/eventos/registro.js"></script>
    <script type="module" src="/js/utils/load-icons.js"></script>
    <script type="module" src="/js/include.js"></script>
    <script type="module" src="/js/components/page-transition.js"></script>
  </body>
</html>
