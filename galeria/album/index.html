<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="index, follow">

    <title>Álbum | Galería · Iglesia Restauración Divina</title>
    <meta name="description" content="Detalles del álbum — Galería de Iglesia Restauración Divina">
    <meta name="author" content="Iglesia Restauración Divina" />

    <link href="https://raw.githubusercontent.com/DanR978/IglesiaRestauracion/refs/heads/main/resources/media/logo%20icons/light-church-logo.ico" rel="icon">
    <link href="https://raw.githubusercontent.com/DanR978/IglesiaRestauracion/refs/heads/main/resources/media/logo%20icons/light-church-logo.ico" rel="icon" media="(prefers-color-scheme: light)">
    <link href="https://raw.githubusercontent.com/DanR978/IglesiaRestauracion/refs/heads/main/resources/media/logo%20icons/dark-church-logo.ico" rel="icon" media="(prefers-color-scheme: dark)">

    <link rel="canonical" href="https://www.irdlex.org/galeria/album" />

    <base href="/">
    <link rel="stylesheet" href="css/style.css">
    <meta name="format-detection" content="telephone=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>

  <body class="page-album-detail">
    <div id="ird-splash"></div>
    <script type="module" src="/js/components/splash.js"></script>

    <header id="header" data-hero-size="page"
      data-hero="https://snqwxgyhfiinouewxgiy.supabase.co/storage/v1/object/public/web-images/worshipers.jpg"></header>

    <div class="hero-content glass-card rg-pd animate-fade-in" data-threshold="0.8" id="galAlbumHero">
      <h1 class="hero__page-title" id="galAlbumTitle">ÁLBUM</h1>
      <h2 class="hero__page-subtitle" id="galAlbumSubtitle">Cargando…</h2>
    </div>

    <main>

      <section class="dg-back-section">
        <a href="/galeria" class="dg-back">
          <i class="fas fa-arrow-left"></i> Volver a la galería
        </a>
      </section>

      <section class="gal-album-detail" id="galAlbumDetail">
        <div class="dscp-loading"><i class="fas fa-spinner fa-spin"></i> Cargando álbum…</div>
      </section>

      <section class="gal-grid-section">
        <div class="gal-grid" id="galGrid"></div>
      </section>

    </main>

    <!-- Lightbox (filled by /js/components/lightbox.js) -->
    <div class="lightbox" id="lightbox" hidden role="dialog" aria-label="Visor de imagen">
      <button class="lightbox__close" id="lbClose" aria-label="Cerrar"><i class="fas fa-times"></i></button>
      <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>
      <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Siguiente"><i class="fas fa-chevron-right"></i></button>

      <div class="lightbox__stage" id="lbStage">
        <img class="lightbox__img" id="lbImg" alt="" />
      </div>

      <div class="lightbox__bar">
        <span class="lightbox__counter" id="lbCounter">1 / 1</span>
        <span class="lightbox__caption" id="lbCaption"></span>
        <div class="lightbox__actions">
          <button class="lightbox__btn" id="lbShare" aria-label="Compartir"><i class="fas fa-share-alt"></i></button>
          <a class="lightbox__btn" id="lbDownload" download aria-label="Descargar"><i class="fas fa-download"></i></a>
          <button class="lightbox__btn" id="lbFullscreen" aria-label="Pantalla completa"><i class="fas fa-expand"></i></button>
        </div>
      </div>
    </div>

    <footer id="footer"></footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/utils/load-icons.js"></script>
    <script type="module" src="/js/include.js"></script>
    <script type="module" src="/js/components/page-transition.js"></script>
    <script type="module" src="/js/pages/galeria/album.js"></script>
  </body>
</html>
