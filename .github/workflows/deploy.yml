# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Generate config.js from secrets
        run: |
          cat > js/lib/config.js << 'JSEOF'
          export const CONFIG = {
            SUPABASE_URL:      '${{ secrets.SUPABASE_URL }}',
            SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}',
            STORAGE_WEB:       '${{ secrets.STORAGE_WEB }}',
            STORAGE_EVENTS:    '${{ secrets.STORAGE_EVENTS }}',
            YT_API_KEY:        '${{ secrets.YT_API_KEY }}',
            YT_CHANNEL_HANDLE: '${{ secrets.YT_CHANNEL_HANDLE }}',
            YT_LIVE_FN:        '${{ secrets.YT_LIVE_FN }}',
          };
          JSEOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment