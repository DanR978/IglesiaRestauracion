<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin – Eventos</title>
<style>
:root{
  /* your palette */
  --color-primary:#345a65; --color-secondary:#d98c59; --color-accent:#be660e;
  --color-info:#2d4e57; --color-muted:#736960; --color-dark:#394548;
  --color-white:#ffffff; --color-black:#000000; --color-bg-light:#F4F6F7;

  --fs-sm: clamp(0.55rem, 0.05rem + 1vw, 0.9rem);
  --fs-base: clamp(1rem, 0.9vw, 1.125rem);
  --fs-md: clamp(0.69rem, 0.07rem + 1.65vw, 1.13rem);
  --fs-xl: clamp(1.125rem, -0.2031em + 4.25vw, 2.1875rem);

  --r: 14px;
  --shadow: 0 10px 30px rgba(0,0,0,.12);
}

*{box-sizing:border-box}
body{margin:0;font-family:var(--font-base, system-ui, -apple-system, Segoe UI, Roboto, Inter, "Noto Sans", sans-serif);background:var(--color-bg-light);color:var(--color-dark)}
.container{max-width:1100px;margin:auto;padding:24px 16px}
h1{font-size:var(--fs-xl);margin:0 0 16px}
.card{background:var(--color-white);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width: 900px){ .row{grid-template-columns: 1.1fr .9fr} }

input, select, button, textarea{
  font:inherit;border:1px solid #e3e7ea;border-radius:var(--r);padding:10px 12px;background:#fff;color:var(--color-dark)
}
input[type="date"]{padding:8px 12px}
input[type="file"]{padding:8px}
label{font-weight:600;font-size:var(--fs-sm);display:block;margin-bottom:6px;color:var(--color-info)}
button{cursor:pointer}
.btn{background:var(--color-primary);color:#fff;border:none;padding:10px 14px;border-radius:12px}
.btn.secondary{background:var(--color-secondary);color:#000}
.btn.danger{background:#c0392b;color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.badge{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 10px;background:#eef5f6;color:#17414a;font-weight:600}

.grid{display:grid;gap:12px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.grid .full{grid-column:1 / -1}

.event-list{display:grid;gap:12px;max-height:70vh;overflow:auto}
.event-item{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:14px;border:1px solid #eef2f4;padding:10px}
.event-thumb{width:80px;height:60px;border-radius:10px;object-fit:cover;background:#eef2f4}
.event-meta{font-size:var(--fs-sm);color:#334155}
.event-title{font-weight:800}
.event-actions{display:flex;gap:8px}

.auth{display:grid;gap:10px;max-width:420px;margin:auto;margin-top:36px}
.auth h2{margin:0 0 10px}
.notice{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12}
.success{padding:12px;border-radius:12px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.hidden{display:none !important}
hr{border:none;border-top:1px solid #eaeef1;margin:12px 0}
.small{font-size:var(--fs-sm)}
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Administrar Eventos</h1>
      <div class="badge hidden" id="whoami">No conectado</div>
    </div>

    <!-- Auth -->
    <section class="card auth" id="auth-card">
      <h2>Iniciar Sesión (Admin)</h2>
      <div class="small">Solo usuarios autorizados verán el panel.</div>
      <label for="email">Correo</label>
      <input id="email" type="email" placeholder="admin@tu-iglesia.org" autocomplete="email" />
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <div style="display:flex; gap:8px">
        <button class="btn" id="login">Entrar</button>
        <button class="btn secondary" id="logout" disabled>Salir</button>
      </div>
      <div class="notice hidden" id="auth-msg"></div>
    </section>

    <!-- Not authorized -->
    <section class="card hidden" id="not-admin">
      <div class="notice">Tu cuenta no tiene acceso de administrador.</div>
    </section>

    <!-- Admin Panel -->
    <section class="row hidden" id="admin-panel">
      <!-- Create/Update -->
      <div class="card">
        <h2 style="margin-top:0">Nuevo Evento</h2>
        <form id="event-form" class="grid">
          <div class="grid cols-2">
            <div>
              <label>Título</label>
              <input name="title" required placeholder="Servicio Dominical" />
            </div>
            <div>
              <label>Etiqueta</label>
              <input name="tag" placeholder="Culto / Juventud / ..." />
            </div>
          </div>

          <div class="grid cols-3">
            <div>
              <label>Fecha</label>
              <input name="date" type="date" required />
            </div>
            <div>
              <label>Hora</label>
              <input name="time" placeholder="11:00" />
            </div>
            <div>
              <label>Ubicación</label>
              <input name="location" placeholder="2601 Clays Mill Rd" />
            </div>
          </div>

          <div class="grid cols-2">
            <div>
              <label>CTA Texto</label>
              <input name="cta_label" placeholder="Detalles / Registrarme" />
            </div>
            <div>
              <label>CTA URL</label>
              <input name="cta_url" placeholder="/eventos/servicio-dominical" />
            </div>
          </div>

          <div class="grid">
            <div class="full">
              <label>Imagen</label>
              <input name="image" type="file" accept="image/*" />
              <div class="small">PNG/JPG, máx ~2–4MB recomendado.</div>
            </div>
          </div>

          <div style="display:flex; gap:8px; align-items:center">
            <button class="btn" type="submit" id="save">Guardar</button>
            <div id="upload-status" class="small"></div>
          </div>
        </form>
        <div class="success hidden" id="save-ok">¡Evento guardado!</div>
      </div>

      <!-- List -->
      <div class="card">
        <h2 style="margin-top:0">Eventos</h2>
        <div class="small" id="counts">Cargando…</div>
        <div class="event-list" id="events"></div>
      </div>
    </section>
  </div>

  <!-- Firebase SDKs (v10+) -->
  <script type="module">
    // --- 1) Firebase config (FILL THESE) ---
    const firebaseConfig = {
      apiKey:        "YOUR_API_KEY",
      authDomain:    "YOUR_PROJECT.firebaseapp.com",
      projectId:     "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      appId:         "YOUR_APP_ID"
    };
    // (You can copy these from Firebase Console > Project settings)

    // --- 2) Imports ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, doc, deleteDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import {
      getStorage, ref as sRef, uploadBytesResumable, getDownloadURL, deleteObject, listAll
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

    // --- 3) Init ---
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const st   = getStorage(app);

    // --- 4) Admin gate: you are admin if a doc exists at /admins/{uid} ---
    async function isAdmin(uid){
      if (!uid) return false;
      const snap = await getDoc(doc(db, "admins", uid));
      return snap.exists();
    }

    // --- 5) UI helpers ---
    const $ = sel => document.querySelector(sel);
    const eventsEl = $("#events");
    const countsEl = $("#counts");
    const whoamiEl = $("#whoami");
    const authMsg  = $("#auth-msg");

    function normalizeForm(f){
      const fd = new FormData(f);
      const get = k => (fd.get(k) || "").toString().trim();
      const date = get("date"); // YYYY-MM-DD
      return {
        title: get("title"),
        date,  // keep as string so your rail sorts the same
        time: get("time"),
        location: get("location"),
        tag: get("tag"),
        cta_label: get("cta_label"),
        cta_url: get("cta_url"),
        imageFile: fd.get("image")
      };
    }

    function renderEventItem(id, e){
      const div = document.createElement("div");
      div.className = "event-item";
      div.innerHTML = `
        <img class="event-thumb" src="${e.image || ''}" alt="">
        <div>
          <div class="event-title">${e.title || "(sin título)"}</div>
          <div class="event-meta">${e.date || ""} ${e.time ? "• " + e.time : ""} ${e.location ? "• " + e.location : ""}</div>
          <div class="small">${e.tag ? "Etiqueta: " + e.tag + " • " : ""}${e.cta_label ? "CTA: " + e.cta_label : ""} ${e.cta_url ? " ("+e.cta_url+")" : ""}</div>
        </div>
        <div class="event-actions">
          <button class="btn danger" data-del="${id}">Eliminar</button>
        </div>`;
      return div;
    }

    // --- 6) Auth UI ---
    $("#login").addEventListener("click", async ()=>{
      authMsg.classList.add("hidden");
      try{
        const email = $("#email").value.trim();
        const pw    = $("#password").value;
        await signInWithEmailAndPassword(auth, email, pw);
      }catch(e){
        authMsg.textContent = "Error al iniciar sesión: " + (e.message || e.code);
        authMsg.classList.remove("hidden");
      }
    });
    $("#logout").addEventListener("click", ()=> signOut(auth));

    onAuthStateChanged(auth, async (user)=>{
      $("#logout").disabled = !user;
      $("#auth-card").classList.toggle("hidden", !!user);
      whoamiEl.classList.toggle("hidden", !user);
      whoamiEl.textContent = user ? `Conectado: ${user.email}` : "No conectado";

      if (!user){
        $("#admin-panel").classList.add("hidden");
        $("#not-admin").classList.add("hidden");
        return;
      }
      const ok = await isAdmin(user.uid);
      $("#not-admin").classList.toggle("hidden", ok);
      $("#admin-panel").classList.toggle("hidden", !ok);
      if (ok) startEventsLiveView();  // live list
    });

    // --- 7) Create event ---
    $("#event-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      $("#save").disabled = true;
      $("#save-ok").classList.add("hidden");
      $("#upload-status").textContent = "";

      try{
        const data = normalizeForm(e.currentTarget);
        if (!data.title || !data.date) throw new Error("Título y Fecha son obligatorios.");

        // create doc now to get id
        const docRef = await addDoc(collection(db, "events"), {
          title: data.title,
          date: data.date,            // keep string YYYY-MM-DD for your rail
          time: data.time,
          location: data.location,
          tag: data.tag,
          cta_label: data.cta_label,
          cta_url: data.cta_url,
          image: "",                  // fill after upload
          createdAt: serverTimestamp()
        });

        // handle image if provided
        const file = data.imageFile instanceof File && data.imageFile.size ? data.imageFile : null;
        if (file){
          const path = `events/${docRef.id}/${file.name}`;
          const ref  = sRef(st, path);
          const task = uploadBytesResumable(ref, file, { contentType: file.type });

          task.on("state_changed", (snap)=>{
            const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
            $("#upload-status").textContent = `Subiendo imagen… ${pct}%`;
          });

          await task;
          const url = await getDownloadURL(ref);
          await addDocUpdate(docRef.path, { image: url }); // helper below
        }

        $("#save-ok").classList.remove("hidden");
        e.currentTarget.reset();
      }catch(err){
        alert(err.message || err);
      }finally{
        $("#save").disabled = false;
        $("#upload-status").textContent = "";
      }
    });

    // update helper (doc path string like "events/abc")
    async function addDocUpdate(path, data){
      const [col, id] = path.split("/");
      await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js").then(({ doc, updateDoc })=>{
        return updateDoc(doc(db, col, id), data);
      });
    }

    // --- 8) Live list + delete ---
    let unsub = null;
    function startEventsLiveView(){
      if (unsub) unsub();
      const q = query(collection(db, "events"), orderBy("date", "asc"));
      unsub = onSnapshot(q, (snap)=>{
        const items = [];
        let upcoming=0, past=0;
        const today = new Date(new Date().toDateString());
        snap.forEach(d=>{
          const e = d.data();
          const el = renderEventItem(d.id, e);
          items.push(el);
          // count
          const isPast = new Date((e.date||"")+"T00:00:00") < today;
          isPast ? past++ : upcoming++;
        });
        eventsEl.replaceChildren(...items);
        countsEl.textContent = `Próximos: ${upcoming} • Pasados: ${past} • Total: ${snap.size}`;

        // wire deletes
        eventsEl.querySelectorAll("[data-del]").forEach(btn=>{
          btn.onclick = ()=> confirmDelete(btn.dataset.del);
        });
      });
    }

    async function confirmDelete(id){
      if (!confirm("¿Eliminar este evento?")) return;
      try{
        // delete storage folder for this event (best effort)
        const folder = sRef(st, `events/${id}`);
        try{
          const all = await listAll(folder);
          await Promise.all(all.items.map(item => deleteObject(item)));
        }catch(_){} // ignore

        await deleteDoc(doc(db, "events", id));
      }catch(err){
        alert("No se pudo eliminar: " + (err.message || err));
      }
    }
  </script>
</body>
</html>
